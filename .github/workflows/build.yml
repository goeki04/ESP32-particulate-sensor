name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Andromeda Engine
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Conan Cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('andromeda/conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install Conan
        run: pip install conan

      - name: Configure Multicore Build
        run: |
          echo "CL=/MP" >> $GITHUB_ENV
          echo "CONAN_CPU_COUNT=4" >> $GITHUB_ENV

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install dependencies
        working-directory: andromeda
        run: >
          conan install .
          -s compiler=msvc
          -g VirtualBuildEnv
          -s compiler.cppstd=20
          -c tools.cmake.cmaketoolchain:generator=Ninja
          -s build_type=Release
          -of conan/
          --build=missing

      - name: Configure
        working-directory: andromeda
        run: cmake --preset conan-release

      - name: Build
        working-directory: andromeda
        run: cmake --build --preset conan-release

  launcher:
    name: Andromeda Launcher
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Inject Github Token
        working-directory: andromeda_launcher
        shell: bash
        run: |
          mkdir -p lib
          echo "const String kGithubToken = '${{ secrets.GH_TOKEN }}';" > lib/config.dart

      - name: Get dependencies
        working-directory: andromeda_launcher
        run: flutter pub get

      - name: Analyze
        working-directory: andromeda_launcher
        run: flutter analyze

      - name: Build Windows
        working-directory: andromeda_launcher
        run: flutter build windows --release