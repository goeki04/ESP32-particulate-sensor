name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Andromeda Engine
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Conan
        run: pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install dependencies
        working-directory: andromeda
        run: >
          conan install .
          -s compiler=msvc
          -s compiler.cppstd=20
          -s build_type=Release
          -of conan/
          --build=missing

      - name: Configure
        working-directory: andromeda
        run: >
          cmake -B build/Release
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=conan/build/Release/generators/conan_toolchain.cmake

      - name: Build
        working-directory: andromeda
        run: cmake --build build/Release --config Release

  launcher:
    name: Andromeda Launcher
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Create Dummy Config Directory
        working-directory: andromeda_launcher
        shell: bash
        run: |
          mkdir -p lib
          echo // Generated File > lib/config.dart

      - name: Inject Github Token
        working-directory: andromeda_launcher
        shell: bash
        run: |
          echo "const String kGithubToken = '${{ secrets.GH_TOKEN }}';" > lib/config.dart

      - name: Get dependencies
        working-directory: andromeda_launcher
        run: flutter pub get

      - name: Analyze
        working-directory: andromeda_launcher
        run: flutter analyze

      - name: Build Windows
        working-directory: andromeda_launcher
        run: flutter build windows --release
